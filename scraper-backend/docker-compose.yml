services:
  scraper-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: scraper-backend:latest
    container_name: scraper-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    # Chromium needs a writable /tmp and /dev/shm. We give it a large tmpfs
    # for /dev/shm instead of relying on Docker's default 64MB, which is
    # too small and causes tabs to crash on complex pages.
    shm_size: "1gb"
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    # Chromium's own sandbox is disabled inside the container (see
    # src/lib/browser.ts). Do NOT add cap_drop:[ALL] here — it prevents the
    # renderer processes from starting under Ubuntu 24.04.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
